name: Build and Deploy Common Admin UI App

on:
  pull_request:
    branches:
      - "main"
    types: [closed]

concurrency:
  group: deploy-${{ github.workflow }}
  cancel-in-progress: false 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Print repo variables and secrets (masked)
        run: |
          echo "Repository variables:"
          echo '${{ toJSON(vars) }}'
          echo "Repository secrets (values are masked by GitHub):"
          echo '${{ toJSON(secrets) }}'

      - name: Build app
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: app-build
          path: dist
          if-no-files-found: error

  deploy:
    needs: build
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [uat, prod]
    environment:
      name: ${{ matrix.environment }}

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: app-build
          path: common-admin-ui
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          repository: ${{ github.repository }}

      - name: Deploy to ${{ matrix.environment }}
        run: |
          echo "Deploying build artifact to ${{ matrix.environment }} environment"
          # Add actual deployment command here.
          # Example:
          # npm run deploy:${{ matrix.environment }}
